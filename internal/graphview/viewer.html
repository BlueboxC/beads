<script>__D3__</script>
<script>
const nodes = __NODES__;
const links = __LINKS__;
const data = __DATA__;
data.nodes = nodes; data.links = links;
const knowledge = !!data.knowledge;
const project = !!data.workspace || !!data.live;
let projectSnapshot = project ? JSON.stringify(data) : null;
const filesByPath = new Map((data.files||[]).map(f=>[f.path,f]));
let visibleIds = new Set(nodes.map(n=>n.id));
let currentSelection = null, navigation = [];
const nodesByID = new Map(nodes.map(n=>[n.id,n]));
const searchText = new Map(nodes.map(n=>[n.id,JSON.stringify(n).toLowerCase()]));
for(const f of data.files||[]){const dir=f.path.includes('/')?f.path.slice(0,f.path.lastIndexOf('/')):'.';const id='directory:'+dir;searchText.set(id,(searchText.get(id)||'')+' '+JSON.stringify(f).toLowerCase())}
const statusColors = { open:"#4a9eff", in_progress:"#f0ad4e", blocked:"#d9534f", closed:"#5cb85c", deferred:"#777", hooked:"#9966cc" };
let width = window.innerWidth, height = window.innerHeight;
let showLabels = true;

const panel = document.querySelector('#details'), detail = document.querySelector('#detail-content');
document.querySelector('#heading h1').textContent=data.title;
function updateStats(){document.querySelector('#stats').textContent=nodes.length+' nodos · '+links.length+' relaciones · '+(data.live?'Dolt · consulta '+(document.querySelector('#refresh-mode').value==='manual'?'manual':'automática'):'instantánea de Beads')+((data.warnings||[]).length?' · '+data.warnings.length+' avisos':'')}
updateStats();
const typeColors={proposal:'#ff8a63',source:'#4a9eff',module:'#5cb85c',code_module:'#edeb71',solution:'#f0ad4e',objective:'#9966cc',decision:'#38b2ac',constraint:'#d9534f',issue:'#a4a9b4',function:'#4a9eff',async_function:'#56c8d8',class:'#e685bc',method:'#93b8ff',struct:'#f8bf87',interface:'#88d8bc',type:'#b8a0ef',enum:'#e7a877',object:'#91cacf'};
const typeLabels={proposal:'Propuesta supervisada',source:'Fuente',module:'Módulo',code_module:'Directorio de código',solution:'Solución',objective:'Objetivo',decision:'Decisión',constraint:'Restricción',issue:project?'Tarea':'Referencia a tarea',function:'Función',async_function:'Función async',class:'Clase',method:'Método',struct:'Estructura',interface:'Interfaz',type:'Tipo',enum:'Enumeración',object:'Objeto'};
const edgeLabels={'proposed-from':'Propuesto desde','proposed-at':'Propuesto en','supersedes':'Sustituye propuesta','reviewed-as':'Aceptado como','supported-by':'Respaldado por','governed-by':'Regido por DOX','recorded-for':'Registrado para','related':'Relacionado con','blocks':'Bloquea','parent-child':'Padre / hijo','contains':'Contiene','learned-at':'Aprendido en','imports':'Importación estática','calls':'Llamada estática','discovered-from':'Descubierto desde'};
const edgeColors={'supported-by':'#73a7d4','governed-by':'#a18fce','recorded-for':'#b9bfc8','related':'#68bb91'};
function nodeColor(d){return (knowledge?(d.type==='issue'&&d.status?statusColors[d.status]:typeColors[d.type]):statusColors[d.status])||'#777'}
function dom(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent.append(e);return e}
function updateLegend(){if(knowledge){
 const legend=document.querySelector('#legend-content');legend.replaceChildren();document.querySelector('#legend-title').textContent='Tipos de nodo';
 for(const [kind,color] of Object.entries(typeColors)){if(!nodes.some(n=>n.type===kind))continue;const row=dom('div',undefined,legend);row.className='legend-item';const swatch=dom('span',undefined,row);swatch.className='legend-swatch';swatch.style.background=color;dom('span',typeLabels[kind],row)}
 dom('h3','Relaciones',legend);for(const kind of [...new Set(links.map(e=>e.type))])dom('p',edgeLabels[kind]||kind,legend);
 if(nodes.some(n=>n.type==='issue'&&n.status)){dom('h3','Estado de tareas',legend);for(const[status,color]of Object.entries(statusColors)){if(!nodes.some(n=>n.type==='issue'&&n.status===status))continue;const row=dom('div',undefined,legend);row.className='legend-item';const swatch=dom('span',undefined,row);swatch.className='legend-swatch';swatch.style.background=color;dom('span',status,row)}}
 dom('p','Borde naranja: requiere revisión',legend);
 if(project){dom('p',(data.files||[]).length+' archivos indexados. Las relaciones de código son sintácticas; no son bloqueos.',legend);dom('p','Familias visuales por ruta o módulo registrado; no añaden relaciones ni propiedad.',legend)}
}
}
updateLegend();
const svg = d3.select("#graph");
const defs = svg.append("defs");
defs.append("marker").attr("id","arrow").attr("viewBox","0 -5 10 10").attr("refX",20).attr("refY",0)
  .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
  .append("path").attr("d","M0,-4L8,0L0,4").attr("fill","#666");

const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const nodeW = knowledge?200:130, nodeH = knowledge?48:40;
const endpoint = value => typeof value==='object'?value.id:value;
for(const e of links){e.source=nodesByID.get(endpoint(e.source));e.target=nodesByID.get(endpoint(e.target))}

// Families are presentation only: explicit path/module scopes and task parents.
function pathFamily(path){
 if(typeof path!=='string'||!path||path==='.'||!path.includes('/')&&!path.startsWith('.')&&path.includes('.'))return 'General';
 const parts=path.split('/');
 return parts[0]==='software_factory'&&/^v[0-9]+$/.test(parts[1]||'')?parts.slice(0,2).join('/'):parts[0];
}
function projectFamilies(items,edges){
 const assigned=new Map();
 for(const n of items){
  const path=n.type==='code_module'?n.detail.directory:n.type==='source'?n.id.slice(7):n.detail&&n.detail.module;
  if(path)assigned.set(n.id,pathFamily(path));
 }
 const parents=new Map(edges.filter(e=>e.type==='parent-child').map(e=>[endpoint(e.target),endpoint(e.source)]));
 const root=id=>{const seen=new Set();while(parents.has(id)&&!seen.has(id)){seen.add(id);id=parents.get(id)}return id};
 const votes=new Map();
 for(const e of edges){if(e.type!=='recorded-for')continue;const source=endpoint(e.source),target=root(endpoint(e.target));if(!assigned.has(source))continue;if(!votes.has(target))votes.set(target,new Set());votes.get(target).add(assigned.get(source))}
 for(const n of items)if(n.type==='issue'){const id=root(n.id),scopes=votes.get(id);assigned.set(n.id,scopes&&scopes.size===1?[...scopes][0]:'Tareas · '+id.replace(/^issue:/,''))}
 const groups=new Map();
 for(const n of items){const name=assigned.get(n.id)||(n.type==='issue'?'Tareas':'General');if(!groups.has(name))groups.set(name,{name,members:[]});groups.get(name).members.push(n)}
 return [...groups.values()];
}
function familyBounds(members){
 const x0=Math.min(...members.map(n=>n.x))-nodeW/2-28,y0=Math.min(...members.map(n=>n.y))-nodeH/2-48;
 const x1=Math.max(...members.map(n=>n.x))+nodeW/2+28,y1=Math.max(...members.map(n=>n.y))+nodeH/2+28;
 return {x:x0,y:y0,width:x1-x0,height:y1-y0};
}
function arrangeFamilies(groups,edges){
 for(const group of groups){
  const ids=new Set(group.members.map(n=>n.id));
  const local=edges.filter(e=>ids.has(endpoint(e.source))&&ids.has(endpoint(e.target))).map(e=>({...e}));
  const sim=d3.forceSimulation(group.members).stop()
   .force('link',d3.forceLink(local).id(n=>n.id).distance(nodeW+35).strength(.08))
   .force('charge',d3.forceManyBody().strength(-120))
   .force('x',d3.forceX(0).strength(.045)).force('y',d3.forceY(0).strength(.045))
   .force('collision',d3.forceCollide(nodeW/2+14).iterations(3));
  sim.tick(300);
  for(const n of group.members){n.y*=.6;n.vx=n.vy=0}
  group.box=familyBounds(group.members);
 }
 groups.sort((a,b)=>b.box.height-a.box.height||a.name.localeCompare(b.name));
 const target=Math.max(...groups.map(g=>g.box.width),Math.sqrt(groups.reduce((a,g)=>a+g.box.width*g.box.height,0))*1.5);
 let x=0,y=0,rowHeight=0;
 for(const group of groups){if(x&&x+group.box.width>target){x=0;y+=rowHeight+80;rowHeight=0}const dx=x-group.box.x,dy=y-group.box.y;for(const n of group.members){n.x+=dx;n.y+=dy}group.box=familyBounds(group.members);x+=group.box.width+80;rowHeight=Math.max(rowHeight,group.box.height)}
}
let families=project?projectFamilies(nodes,links):[];
const familyByNode=new Map();
if(project&&nodes.length){arrangeFamilies(families,links);for(const group of families)for(const n of group.members)familyByNode.set(n.id,group)}
else d3.forceSimulation(nodes).stop()
 .force('link',d3.forceLink(links).id(n=>n.id).distance(knowledge?220:140).strength(.7))
 .force('charge',d3.forceManyBody().strength(knowledge?-650:-400))
 .force('x',d3.forceX(n=>150+n.layer*(knowledge?350:220)).strength(.3))
 .force('y',d3.forceY(height/2).strength(.05))
 .force('collision',d3.forceCollide(knowledge?110:50)).tick(300);
const initialPositions = new Map(nodes.map(d=>[d.id,{x:d.x,y:d.y}]));
const familyLayer=g.append('g'),linkLayer=g.append('g'),nodeLayer=g.append('g');
let family,link,node;
const parentIDs=new Set(links.filter(e=>e.type==='parent-child').map(e=>e.source.id));
const dragSelections=new Map();
const tooltip=d3.select('#tooltip');
function renderGraph(){
 family=familyLayer.selectAll('g').data(families,d=>d.name).join(enter=>{const group=enter.append('g').attr('class','family');group.append('rect');group.append('text');return group});
 family.select('text').text(d=>d.name+' · '+d.members.length)
  .call(d3.drag().subject(e=>({x:e.x,y:e.y})).on('start',(e,d)=>startMove(e,d.members)).on('drag',moveSelection).on('end',finishMove));
 link=linkLayer.selectAll('line').data(links,d=>JSON.stringify([endpoint(d.source),endpoint(d.target),d.type])).join(enter=>{const line=enter.append('line');line.append('title');return line})
  .attr('class',d=>'link '+d.type).attr('stroke',d=>edgeColors[d.type]||'#888')
  .attr('stroke-dasharray',d=>d.type==='parent-child'||d.type==='governed-by'?'5,3':null);
 link.select('title').text(d=>(edgeLabels[d.type]||d.type)+(d.count?' · '+d.count+' referencias':'')+(d.validity?' · '+d.validity:''));
 node=nodeLayer.selectAll('g').data(nodes,d=>d.id).join(enter=>{
  const group=enter.append('g').attr('class','node').attr('tabindex',0).attr('role','button');
  group.append('rect').attr('width',nodeW).attr('height',nodeH).attr('x',-nodeW/2).attr('y',-nodeH/2);
  group.append('text').attr('class','title-text').attr('text-anchor','middle').attr('dy',-3);
  group.append('text').attr('class','id-text').attr('text-anchor','middle').attr('dy',12);return group;
 }).attr('aria-label',d=>d.title).call(d3.drag().on('start',dragStart).on('drag',dragged).on('end',dragEnd));
 node.select('rect').attr('fill',nodeColor).attr('stroke',d=>d.validity==='needs_review'?'#ffae42':d3.color(nodeColor(d)).darker(.5)).attr('stroke-width',d=>d.validity==='needs_review'?3:1.5);
 node.select('.title-text').text(d=>d.title.length>(knowledge?28:18)?d.title.substring(0,knowledge?27:17)+'…':d.title);
 node.select('.id-text').text(d=>knowledge?(typeLabels[d.type]||d.type)+(d.status?' · '+d.status:d.validity?' · '+d.validity:''):d.id+' P'+d.priority);
 node.selectAll('text').style('opacity',showLabels?1:0);
 node.on('click',(e,d)=>choose(d)).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(d)}});
node.on("mouseover", (e, d) => {
  tooltip.selectAll("*").remove();
  tooltip.text("");
  const idSpan = tooltip.append("span").attr("class","tt-id").text(d.id);
  tooltip.append("span").attr("class","tt-status").style("background", nodeColor(d)).text(knowledge?(typeLabels[d.type]||d.type):d.status);
  tooltip.append("br");
  tooltip.append("strong").text(d.title);
  tooltip.append("br");
  tooltip.append("span").text(knowledge ? "Vigencia: " + (d.validity || "fuente / referencia") : "Priority: P" + d.priority + " | Type: " + d.type);
  if (d.assignee) { tooltip.append("br"); tooltip.append("span").text("Assignee: " + d.assignee); }
  tooltip.append("br");
  tooltip.append("span").text(knowledge ? "Selecciona para ver fuentes y evidencia" : "Layer: " + d.layer);
  tooltip.style("opacity", 1).style("left", (e.pageX+12)+"px").style("top", (e.pageY-10)+"px");
}).on("mouseout", () => { tooltip.style("opacity", 0); tooltip.selectAll("*").remove(); });

 drawPositions();

function fitToView() {
  if (!nodes.length) return;
  const padding = 40;
  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
  nodes.filter(d=>visibleIds.has(d.id)).forEach(d => {
    if (typeof d.x !== "number" || typeof d.y !== "number") return;
    xMin = Math.min(xMin, d.x - nodeW/2);
    xMax = Math.max(xMax, d.x + nodeW/2);
    yMin = Math.min(yMin, d.y - nodeH/2);
    yMax = Math.max(yMax, d.y + nodeH/2);
  });
  if (!isFinite(xMin)) return;
  const bboxW = xMax - xMin + 2*padding;
  const bboxH = yMax - yMin + 2*padding;
  const availableWidth = width - (panel.hidden ? 0 : panel.getBoundingClientRect().width);
  const topReserve=document.querySelector("#heading").getBoundingClientRect().bottom+18;
  const bottomReserve=height-document.querySelector("#controls").getBoundingClientRect().top+20;
  const availableHeight=Math.max(100,height-topReserve-bottomReserve);
  const scale = Math.min(availableWidth/bboxW, availableHeight/bboxH, 4);
  const tx = availableWidth/2 - scale * (xMin + xMax)/2;
  const ty = topReserve+availableHeight/2 - scale * (yMin + yMax)/2;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

    if(!occupied.some(p=>Math.abs(p.x-x)<nodeW+24&&Math.abs(p.y-y)<nodeH+24))break;
    y+=nodeH+30;if(step%10===9){x+=nodeW+40;y=members.length?members[0].y:100}
   }
   n.x=x;n.y=y;n.vx=n.vy=0;occupied.push(n);members.push(n);initialPositions.set(n.id,{x,y});

 if(!Array.isArray(next.nodes)||!Array.isArray(next.links)||!next.workspace||data.workspace&&next.workspace!==data.workspace)throw Error('El servidor devolvió otro proyecto o un grafo inválido');
 if(dragSelections.size){pendingPage=next;return}
 const old=new Map(nodes.map(n=>[n.id,{x:n.x,y:n.y}]));const selection=currentSelection;const scroll=panel.scrollTop;const inputs=[...detail.querySelectorAll('input')].map(e=>({label:e.getAttribute('aria-label'),value:e.value}));
 const live=data.live;projectSnapshot=JSON.stringify(next);
 Object.assign(data,next);data.live=live;
 nodes.splice(0,nodes.length,...next.nodes);links.splice(0,links.length,...next.links);data.nodes=nodes;data.links=links;
 refreshLookups();
 for(const n of nodes){if(old.has(n.id))Object.assign(n,old.get(n.id))}
 for(const id of initialPositions.keys())if(!nodesByID.has(id))initialPositions.delete(id);
 for(const e of links){e.source=nodesByID.get(endpoint(e.source));e.target=nodesByID.get(endpoint(e.target));if(!e.source||!e.target)throw Error('Relación sin nodo')}
 families=projectFamilies(nodes,links);familyByNode.clear();for(const group of families)for(const n of group.members)familyByNode.set(n.id,group);
 if(!liveReady){if(nodes.length)arrangeFamilies(families,links);for(const n of nodes)initialPositions.set(n.id,{x:n.x,y:n.y})}else placeNewNodes(old);parentIDs.clear();for(const e of links)if(e.type==='parent-child')parentIDs.add(e.source.id);
 renderGraph();updateLegend();updateStats();updateFilterChoices();document.querySelector('#heading h1').textContent=data.title;
 navigation=navigation.filter(p=>p.kind==='node'?nodesByID.has(p.id):filesByPath.has(p.id));
 if(selection&&selection.kind==='node'&&nodesByID.has(selection.id))choose(nodesByID.get(selection.id),false,false);
 else if(selection&&selection.kind==='file'&&filesByPath.has(selection.id)){chooseFile(filesByPath.get(selection.id),false);applyFilters(false)}
 else{currentSelection=null;if(selection){detail.replaceChildren();dom('p','El elemento seleccionado ya no está en el grafo.',detail)}applyFilters(false)}
 for(const saved of inputs){const input=[...detail.querySelectorAll('input')].find(e=>e.getAttribute('aria-label')===saved.label);if(input){input.value=saved.value;if(input.oninput)input.oninput()}}panel.scrollTop=scroll;if(historyVisible)renderHistory();
 if(!liveReady){liveReady=true;fitToView()}
}
function schedulePoll(delay){clearTimeout(pollTimer);if(automaticRefresh()&&!document.hidden)pollTimer=setTimeout(pollGraph,delay)}
async function pollGraph(){
 if(pollBusy||document.hidden)return;clearTimeout(pollTimer);pollBusy=true;refreshButton.disabled=true;connectionState='loading';updateConnection();
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),35000);
 try{
  const headers={};if(liveETag)headers['If-None-Match']=liveETag;if(liveToken)headers.Authorization='Bearer '+liveToken;
  const response=await fetch('/viewer/graph',{headers,cache:'no-store',credentials:'omit',signal:controller.signal});
  if(response.status===401){document.querySelector('#auth').hidden=false;connectionState='auth';updateConnection();return}
  if(response.status!==304){if(!response.ok)throw Error('HTTP '+response.status);const next=await response.json();applySnapshot(next);liveETag=response.headers.get('ETag')||''}
  failures=0;document.querySelector('#auth').hidden=true;lastChecked=new Date().toLocaleTimeString();connectionState='connected';updateConnection();
 }catch(error){liveETag='';failures++;connectionState='error';updateConnection();}
 finally{clearTimeout(timeout);pollBusy=false;refreshButton.disabled=false;if(document.querySelector('#auth').hidden)schedulePoll(Math.min(60000,5000*2**Math.min(failures,4)))}
}
if(data.live){
 if(data.live.endpoint!=='/viewer/graph')throw Error('Destino del visor inválido');
 document.querySelector('#live-controls').hidden=false;
 // Persist only this presentation preference, never project data or tokens.
 try{if(localStorage.getItem('beads.graph.refreshMode')==='manual')refreshMode.value='manual'}catch{}
 updateStats();updateConnection();
 refreshButton.onclick=()=>{liveETag='';pollGraph()};
 refreshMode.onchange=()=>{
  clearTimeout(pollTimer);
  try{localStorage.setItem('beads.graph.refreshMode',refreshMode.value)}catch{}
  updateStats();updateConnection();
  if(automaticRefresh()){liveETag='';pollGraph()}
 };
 document.querySelector('#connect').onclick=()=>{liveToken=document.querySelector('#token').value;document.querySelector('#token').value='';liveETag='';document.querySelector('#auth').hidden=true;pollGraph()};
 document.addEventListener('visibilitychange',()=>{clearTimeout(pollTimer);if(!document.hidden&&automaticRefresh()){liveETag='';pollGraph()}});
 if(automaticRefresh())pollGraph();
}
window.addEventListener('resize',()=>{width=window.innerWidth;height=window.innerHeight;fitToView()});
if(data.warnings&&data.warnings.length){panel.hidden=false;dom('h2','Avisos de fuentes',detail);valueView(data.warnings,detail)}
fitToView();
</script>
